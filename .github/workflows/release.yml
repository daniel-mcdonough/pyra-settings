# Build the .deb and publish it as a GitHub release when a v* tag is pushed.
#
#   git tag -a v0.14 -m "pyra-settings 0.14" && git push origin v0.14
#
# The tag must match the top entry of debian/changelog, so bump that first.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches debian/changelog
        run: |
          version=$(sed -n '1s/.*(\(.*\)).*/\1/p' debian/changelog)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match changelog version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Test
        run: python3 -m unittest discover -s tests

      - name: Build
        run: scripts/build-deb.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/pyra-settings_${VERSION}_all.deb" \
            --title "pyra-settings $VERSION" \
            --notes "Install with: sudo apt install ./pyra-settings_${VERSION}_all.deb"
